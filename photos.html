<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Management - Admin Panel</title>
    <style>
        :root {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 30px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .btn:hover { background: var(--primary-dark); }
        .btn-outline { background: white; color: var(--primary); border: 1px solid var(--primary); }

        /* Photo Grid */
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .photo-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); position: relative; }
        .photo-card img { width: 100%; height: 180px; object-fit: cover; }
        
        .photo-badges { position: absolute; top: 10px; left: 10px; display: flex; gap: 5px; }
        .badge { background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge.featured { background: #f59e0b; }

        .photo-details { padding: 15px; }
        .photo-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .photo-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .photo-tags { font-size: 0.8rem; color: #3b82f6; margin-bottom: 15px; }
        
        .photo-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 10px; }
        .icon-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; gap: 5px; font-size: 0.85rem; }
        .icon-btn.edit:hover { color: #3b82f6; }
        .icon-btn.delete:hover { color: #ef4444; }

        /* Modal / Form */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal h2 { margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.9rem; }
        .form-group input[type="text"], .form-group input[type="date"], .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
        .form-group input[type="file"] { width: 100%; padding: 10px; background: #f9fafb; border: 1px dashed var(--primary); border-radius: 8px; cursor: pointer; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; cursor: pointer; }

        /* Confirm Delete Dialog */
        .confirm-dialog { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 200; text-align: center; width: 300px; }
        .confirm-dialog h3 { color: #ef4444; margin-bottom: 10px; }
        .confirm-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }

        svg { width: 18px; height: 18px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>Photo Management</h1>
            <p style="color: #6b7280; font-size: 0.9rem;">Manage all app photos, categories, and tags.</p>
        </div>
        <button class="btn" onclick="openModal()">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add New Photo
        </button>
    </div>

    <!-- Photos Grid -->
    <div class="photo-grid" id="photoGrid">
        <!-- Sample Photo Card -->
        <div class="photo-card" id="photo-1">
            <div class="photo-badges">
                <span class="badge featured">⭐ Featured</span>
                <span class="badge">Events</span>
            </div>
            <img src="https://via.placeholder.com/400x300/fecaca/dc2626?text=Sample+Event+Photo" alt="Event">
            <div class="photo-details">
                <div class="photo-title">Annual Conference 2026</div>
                <div class="photo-desc">Main stage presentation photo with full audience view.</div>
                <div class="photo-tags">#conference #mainstage #2026</div>
                <div class="photo-actions">
                    <button class="icon-btn edit" onclick="editPhoto(1)">
                        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit
                    </button>
                    <button class="icon-btn delete" onclick="confirmDelete(1)">
                        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="photoModal">
        <div class="modal">
            <h2 id="modalTitle">Upload New Photo</h2>
            
            <div class="form-group">
                <label>Upload Image (or Replace)</label>
                <input type="file" accept="image/*">
            </div>
            <div class="form-group">
                <label>Title</label>
                <input type="text" placeholder="Enter photo title">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea rows="3" placeholder="Enter details about the photo"></textarea>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select>
                    <option>Events</option>
                    <option>News</option>
                    <option>Jerseys</option>
                    <option>Members</option>
                    <option>Templates</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tags (comma separated)</label>
                <input type="text" placeholder="e.g. #event, #new, #team">
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date">
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="featuredCheck">
                <label for="featuredCheck" style="margin:0;">⭐ Mark as Featured</label>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button class="btn" style="flex: 1; justify-content: center;" onclick="closeModal()">Save Photo</button>
                <button class="btn btn-outline" style="flex: 1; justify-content: center;" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Dialog -->
    <div class="modal-overlay" id="deleteOverlay" style="z-index: 199;"></div>
    <div class="confirm-dialog" id="deleteDialog">
        <h3>Are you sure?</h3>
        <p>Do you really want to delete this photo? This action cannot be undone.</p>
        <div class="confirm-actions">
            <button class="btn btn-outline" onclick="cancelDelete()">Cancel</button>
            <button class="btn" style="background: #ef4444;" onclick="executeDelete()">Yes, Delete</button>
        </div>
    </div>

    <script>
        let deleteTargetId = null;

        // Modal Functions
        function openModal() {
            document.getElementById('modalTitle').innerText = "Upload New Photo";
            document.getElementById('photoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('photoModal').style.display = 'none';
        }

        function editPhoto(id) {
            document.getElementById('modalTitle').innerText = "Edit Photo Details";
            document.getElementById('photoModal').style.display = 'flex';
        }

        // Delete Confirmation Functions
        function confirmDelete(id) {
            deleteTargetId = id;
            document.getElementById('deleteOverlay').style.display = 'block';
            document.getElementById('deleteDialog').style.display = 'block';
        }

        function cancelDelete() {
            deleteTargetId = null;
            document.getElementById('deleteOverlay').style.display = 'none';
            document.getElementById('deleteDialog').style.display = 'none';
        }

        function executeDelete() {
            if (deleteTargetId !== null) {
                const card = document.getElementById('photo-' + deleteTargetId);
                if (card) {
                    card.style.display = 'none'; // Removes photo card from grid
                }
                cancelDelete();
                // ഒരു ചെറിയ നോട്ടിഫിക്കേഷൻ
                alert("Photo deleted successfully and synced to backend!");
            }
        }
    </script>
</body>
</html>
