<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Manhajul Hidaya</title>
    <style>
        :root {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .login-container { width: 100%; max-width: 400px; background: var(--card-bg); padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border); text-align: center; }
        
        .logo-area { width: 80px; height: 80px; background: #fee2e2; color: var(--primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto; }
        
        .login-container h2 { font-size: 1.5rem; margin-bottom: 5px; color: var(--text-main); }
        .login-container p { color: #6b7280; font-size: 0.9rem; margin-bottom: 25px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 1rem; transition: 0.2s; }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1); }

        .btn-login { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; margin-top: 10px; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-login:hover { background: var(--primary-dark); }
        .btn-login:disabled { background: #fca5a5; cursor: not-allowed; }

        .error-message { color: #ef4444; background: #fee2e2; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; display: none; font-weight: 600; }

        svg { width: 40px; height: 40px; stroke-width: 1.5; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <h2>Admin Portal</h2>
        <p>Manhajul Hidaya Secure Access</p>

        <div class="error-message" id="errorMsg">Invalid Username or Password!</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Admin ID / Email</label>
                <input type="text" id="adminId" placeholder="Enter your admin id" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">
                Secure Login
                <svg style="width: 18px; height: 18px;" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
        </form>
        
        <p style="margin-top: 20px; font-size: 0.8rem; color: #9ca3af;">
            <svg style="width: 14px; height: 14px; vertical-align: middle; margin-right: 4px;" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Protected Route. Authorized Personnel Only.
        </p>
    </div>

    <script>
        // --- Security & Login Logic ---
        function handleLogin(event) {
            event.preventDefault(); // Prevent page reload
            
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const id = document.getElementById('adminId').value;
            const pass = document.getElementById('adminPass').value;

            // Loading state
            btn.disabled = true;
            btn.innerHTML = 'Authenticating...';
            errorMsg.style.display = 'none';

            // ബാക്ക്-എൻഡുമായുള്ള കണക്ഷൻ ഇവിടെയാണ് നൽകേണ്ടത്
            // ഉദാഹരണത്തിന്: Firebase Auth ഉപയോഗിക്കുകയാണെങ്കിൽ: 
            // firebase.auth().signInWithEmailAndPassword(id, pass)
            
            // തൽക്കാലം ഈ ഫ്രണ്ട്-എൻഡ് പ്രവർത്തിക്കാൻ ഒരു ഡെമോ ലോഗിൻ നൽകുന്നു
            setTimeout(() => {
                if (id === "admin" && pass === "12345") {
                    // Login Success
                    btn.style.background = "#10b981";
                    btn.innerHTML = 'Login Successful ✅';
                    
                    // Session Storage-ൽ സേവ് ചെയ്യുന്നു (ബാക്ക്-എൻഡ് ടോക്കൺ പോലെ)
                    sessionStorage.setItem("isAdminLoggedIn", "true");
                    
                    // ഡാഷ്ബോർഡിലേക്ക് റീഡയറക്ട് ചെയ്യുന്നു (നേരത്തെ ഉണ്ടാക്കിയ index.html)
                    setTimeout(() => {
                        window.location.href = 'index.html'; 
                    }, 1000);
                } else {
                    // Login Failed
                    btn.disabled = false;
                    btn.style.background = "var(--primary)";
                    btn.innerHTML = `Secure Login <svg style="width: 18px; height: 18px;" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;
                    errorMsg.style.display = 'block';
                }
            }, 1500); // 1.5 സെക്കൻഡ് ഡിലേ (Network request simulate ചെയ്യാൻ)
        }

        // ഓൾറെഡി ലോഗിൻ ചെയ്തിട്ടുണ്ടെങ്കിൽ നേരിട്ട് ഡാഷ്ബോർഡിലേക്ക് പോകാൻ
        window.onload = () => {
            if (sessionStorage.getItem("isAdminLoggedIn") === "true") {
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>
